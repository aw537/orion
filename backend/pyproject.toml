[project]
name = "orion-backend"
version = "0.1.0"
description = "Orion — AI-powered local knowledge architecture"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30.0",
    "psycopg2-binary>=2.9.0",
    "alembic>=1.14.0",
    "chromadb>=0.5.23,<1.0.0",
    "redis[hiredis]>=5.2.0",
    "httpx>=0.28.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.7.0",
    "apscheduler>=3.10.4",
    "mcp[cli]>=1.0.0",
    "python-multipart>=0.0.18",
    "pyyaml>=6.0.2",
    "click>=8.1.0",
    "textual>=0.85.0",
    "graphifyy>=0.4.10",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
    "aiosqlite>=0.20.0",
]

[build-system]
requires = ["setuptools>=75.0"]
build-backend = "setuptools.build_meta"

[project.scripts]
orion = "app.cli:cli"

[tool.setuptools.packages.find]
include = ["app*"]

